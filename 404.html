<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1257A6" />
    <title>Page not found — Jeush Daniel Peraren</title>
    <link rel="icon" href="assets/avatar-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles/main.css" />
    <style>
      .not-found { min-height: 100vh; display: grid; place-items: center; padding: 32px; text-align: center; }
      .not-found-inner { max-width: 520px; }
      .not-found-code { color: var(--blue-700); font: 600 12px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; }
      .not-found h1 { margin: 18px 0; color: var(--blue-950); font-size: clamp(3rem, 9vw, 6rem); letter-spacing: -.08em; line-height: .95; }
      .not-found p { color: var(--muted); }
      .not-found a { display: inline-flex; margin-top: 18px; }
    </style>
  </head>
  <body>
    <main class="not-found">
      <div class="not-found-inner">
        <span class="not-found-code">404 / route not found</span>
        <h1>Let’s find<br /><span style="color: var(--blue-700);">the right page.</span></h1>
        <p>This route is not part of the portfolio yet. Head back to the homepage and keep exploring.</p>
        <a class="button button-primary" href="index.html">Back to portfolio <span aria-hidden="true">↗</span></a>
      </div>
    </main>
  </body>
</html>
